name: Release Screen Sharing Rubyfier

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (for example v1.0.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
          fetch-depth: 0

      - name: Validate tag and toolchain
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-alpha\.[0-9]+)?$ ]]
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          test "$(uname -m)" = arm64
          xcodebuild -version
          swift --version
          echo "SSP_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          echo "DMG_NAME=ScreenSharingRubyfier-$RELEASE_TAG-macOS-arm64.dmg" >> "$GITHUB_ENV"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Test and build the app DMG
        run: |
          swift build -Xswiftc -warnings-as-errors
          swift test -Xswiftc -warnings-as-errors
          python3 Scripts/test-loopback-relay.py
          python3 Scripts/test-rubyfied-retry.py
          python3 Scripts/test-rubyfied-media.py
          bash Packaging/build-app-dmg.sh

      - name: Verify mounted contents and offline guide
        run: |
          trap 'printf "::error::Mounted-image verification failed at line %s: %s\n" "$LINENO" "$BASH_COMMAND"' ERR
          mount_path=$(mktemp -d "$RUNNER_TEMP/ssp-mount.XXXXXX")
          hdiutil attach "dist/$DMG_NAME" -readonly -nobrowse -mountpoint "$mount_path"
          trap 'hdiutil detach "$mount_path"' EXIT
          app="$mount_path/Screen Sharing Rubyfier.app"
          python3 Scripts/smoke-app.py "$app"
          test "$(lipo -archs "$app/Contents/MacOS/ScreenSharingProxy")" = arm64
          test -L "$mount_path/Applications"
          test "$(readlink "$mount_path/Applications")" = /Applications
          test -L "$mount_path/Terminal"
          test "$(readlink "$mount_path/Terminal")" = /System/Applications/Utilities/Terminal.app
          cmp Packaging/README.html "$mount_path/README.html"
          .build/dmg-venv/bin/python Scripts/verify-dmg-layout.py "$mount_path"
          python3 Scripts/verify-packaged-guide.py "$mount_path"
          cd dist
          shasum -a 256 "$DMG_NAME" > SHA256SUMS

      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes="docs/releases/$SSP_VERSION.md"
          test -s "$notes"
          prerelease=false
          latest=true
          if [[ "$RELEASE_TAG" == *-alpha.* ]]; then
            prerelease=true
            latest=false
          fi
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$draft" != true ]]; then
              printf 'This release is already published; use a new version.\n' >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease="$prerelease" --latest=false \
              --title "Screen Sharing Rubyfier $RELEASE_TAG" --notes-file "$notes"
          fi
          gh release upload "$RELEASE_TAG" "dist/$DMG_NAME" dist/SHA256SUMS --clobber
          download_dir=$(mktemp -d "$RUNNER_TEMP/ssp-download.XXXXXX")
          gh release download "$RELEASE_TAG" --dir "$download_dir" --pattern "$DMG_NAME" --pattern SHA256SUMS
          (cd "$download_dir" && shasum -a 256 -c SHA256SUMS)
          cmp "dist/$DMG_NAME" "$download_dir/$DMG_NAME"
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$prerelease" --latest="$latest"
