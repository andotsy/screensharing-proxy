name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check toolchain
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          swift --version
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build and test
        run: |
          swift build -Xswiftc -warnings-as-errors
          swift test -Xswiftc -warnings-as-errors
          export SSP_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :SSPReleaseVersion' Packaging/Info.plist)
          bash Packaging/build-app-dmg.sh
          python3 Scripts/smoke-cli.py .build/release/screensharing-proxy-diagnose
          python3 Scripts/smoke-app.py .build/native-bundle/ScreenSharingProxy.app
          mount_path=$(mktemp -d "$RUNNER_TEMP/ssp-ci-mount.XXXXXX")
          hdiutil attach "dist/ScreenSharingProxy-v$SSP_VERSION-macOS-arm64.dmg" -readonly -nobrowse -mountpoint "$mount_path"
          trap 'hdiutil detach "$mount_path"' EXIT
          .build/dmg-venv/bin/python Scripts/verify-dmg-layout.py "$mount_path"
