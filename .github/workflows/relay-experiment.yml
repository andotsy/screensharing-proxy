name: Ruby relay experiment
on:
  push:
    branches: ['ruby-relay-experiment']
permissions:
  contents: read
jobs:
  evidence:
    runs-on: macos-26
    timeout-minutes: 5
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test existing loopback addresses without changing configuration
        run: /usr/bin/ruby --disable-gems Scripts/probe-loopback.rb
      - name: Measure native-pattern UDP reuse with synthetic loopback packets
        run: /usr/bin/ruby --disable-gems Scripts/probe-udp-reuse.rb
      - name: Exercise the native UDP helper with local-only packet delivery
        run: |
          clang -fobjc-arc -framework Foundation Scripts/probe-native-udp.m -o "$RUNNER_TEMP/probe-native-udp"
          "$RUNNER_TEMP/probe-native-udp"
      - name: Test the real Ruby incoming relay and Apple socket coexistence
        run: python3 Scripts/test-incoming-relay.py --native-helper "$RUNNER_TEMP/probe-native-udp" -v
      - name: Test peer-preserving loopback media and native feedback through Ruby
        run: python3 Scripts/test-loopback-relay.py --native-helper "$RUNNER_TEMP/probe-native-udp" -v
      - name: Inspect native media binding and port selection evidence
        run: |
          python3 Scripts/inspect-native-transport.py
          swift Scripts/inspect-viewer-framework.swift
  macos:
    needs: evidence
    runs-on: macos-26
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check system Ruby protocol and portable core
        run: |
          python3 Scripts/test-ruby-relay.py --portable
          swift test -Xswiftc -warnings-as-errors
      - name: Build and smoke-test the signed native bundle with relay resources
        run: |
          bash Packaging/build-app.sh
          python3 Scripts/smoke-app.py ".build/native-bundle/Screen Sharing Rubyfier.app"
          python3 - <<'PY'
          from pathlib import Path
          resources = Path('.build/native-bundle/Screen Sharing Rubyfier.app/Contents/Resources')
          for name in ['relay.rb', 'incoming-relay.rb', 'loopback-relay.rb']:
              scripts = list(resources.rglob(name))
              assert len(scripts) == 1
              assert scripts[0].read_bytes() == Path('Sources/ProxyCore/Resources', name).read_bytes()
          PY
      - name: Package and exercise the bounded incoming experiment command
        run: |
          bash Packaging/build-relay-experiment.sh
          python3 Scripts/test-incoming-experiment.py dist/ScreenSharingProxy-IncomingExperiment-macOS-arm64/screensharing-proxy-experiment -v
          bash Packaging/build-relay-experiment.sh loopback
          python3 Scripts/test-incoming-experiment.py dist/ScreenSharingProxy-LoopbackExperiment-macOS-arm64/screensharing-proxy-experiment --mode loopback -v
      - name: Save the experimental command for controlled native testing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: relay-experiments-macOS-arm64
          path: dist/ScreenSharingProxy-*Experiment-macOS-arm64.zip
          retention-days: 7
